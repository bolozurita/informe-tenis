<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de Progreso de Tenis</title>
<meta name="description" content="Informe trimestral de progreso para alumnos de tenis: evaluación por área, tests físicos, competencia y plan de trabajo para la familia.">
<meta name="theme-color" content="#0f4c3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23dbe64a' stroke='%230f4c3a' stroke-width='2'/%3E%3Cpath d='M6 8c6 4 6 12 0 16M26 8c-6 4-6 12 0 16' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: banda de cancha (verde profundo) como cabecera, cuerpo en una columna de lectura
   con tarjetas por área; amarillo pelota solo sobre el verde; arcilla para prioridades. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#14261f; --muted:#5d6b64; --line:#d9dfd8;
  --court:#0f4c3a; --court-ink:#f1f6f2; --ball:#dbe64a; --clay:#b9552e; --blue:#1f5c99;
  --good:#1d7a4f; --warn:#a36a00; --idle:#7b8781; --soft:#e9eee8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1714; --surface:#16221d; --ink:#e7eeea; --muted:#9aa8a1; --line:#2a3a33;
    --court:#0c3b2d; --court-ink:#eef5f0; --ball:#dbe64a; --clay:#e08a63; --blue:#7fb2e6;
    --good:#5fc795; --warn:#e0b04a; --idle:#8a9690; --soft:#1d2c26; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1714; --surface:#16221d; --ink:#e7eeea; --muted:#9aa8a1; --line:#2a3a33;
  --court:#0c3b2d; --court-ink:#eef5f0; --ball:#dbe64a; --clay:#e08a63; --blue:#7fb2e6;
  --good:#5fc795; --warn:#e0b04a; --idle:#8a9690; --soft:#1d2c26; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h2{font-size:1.55rem;font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;margin-right:auto;display:flex;gap:8px;align-items:center}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--ball);border:1px solid var(--court);display:inline-block}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--court);color:var(--court-ink)}
.tabs a:not([aria-current]):hover{background:var(--soft)}
.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1rem;line-height:1}
.theme:hover{border-color:var(--court)}
.cloud{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.cloud .dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.cloud .dot.ok{background:var(--good)} .cloud .dot.busy{background:var(--warn)} .cloud .dot.err{background:var(--clay)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.pick{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date],input[type=url],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.pick select{width:auto;max-width:220px}
textarea{min-height:84px;resize:vertical}

main{max-width:980px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card > h2{margin-bottom:12px}
.hint{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}

/* Cabecera del informe */
.hero{background:var(--court);color:var(--court-ink);border-radius:12px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.hero .over{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ball);font-weight:600}
.hero h1{font-size:2.5rem;font-weight:700}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.tile b{font-family:var(--display);font-size:1.7rem;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;opacity:.85}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.summary p{max-width:65ch;font-size:1.05rem}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.clean li{padding-left:14px;border-left:4px solid var(--good)}
ul.clean.pri li{border-left-color:var(--clay)}

.profile{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;align-items:center}
.radar{width:100%;height:auto}
.radar text{font-family:var(--body);font-size:12px;fill:var(--ink)}
.arealist{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0;padding-bottom:0}
.arow b{font-weight:600}
.num{font-family:var(--display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--good)} .down{color:var(--clay)} .same{color:var(--idle)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:14px}
.legend b{color:var(--ink)}

.item{display:grid;grid-template-columns:minmax(150px,1fr) 120px minmax(120px,170px) 22px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.meter i{height:10px;border-radius:2px;background:var(--soft)}
.meter i.on{background:var(--court)}
:root[data-theme="dark"] .meter i.on{background:var(--good)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .meter i.on{background:var(--good)}}
.lvl{font-size:.85rem;color:var(--muted)}
.note{margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:8px;max-width:70ch}
.note small{display:block;font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.pill{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.logrado{color:var(--good)} .pill.progreso{color:var(--warn)} .pill.pendiente{color:var(--idle)}
.goal{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.plan article{border:1px solid var(--line);border-top:4px solid var(--court);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plan dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.plan dd{margin:0 0 6px}
.plan dl{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--court);color:var(--court-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.12)} .btn.ghost:hover{border-color:var(--court);filter:none}
.btn.danger{background:transparent;color:var(--clay);border:1px solid var(--clay)}
.btn.danger.armed{background:var(--clay);color:#fff}
#saved.flash{color:var(--good);font-weight:600}
.empty{text-align:center;padding:40px 20px}

/* Ingreso del entrenador */
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.prog{flex:1 1 220px;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:500;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.rate{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rate:last-of-type{border-bottom:0}
.seg{display:flex;gap:5px}
.seg button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.rowg{display:grid;grid-template-columns:150px 1fr 1fr 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.rowg.g2{grid-template-columns:1fr 170px}
.rowg:last-child{border-bottom:0}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:12px}

@media (max-width:720px){
  .two,.profile{grid-template-columns:1fr}
  .hero h1{font-size:2rem}
  .item{grid-template-columns:1fr 90px 22px}
  .item .lvl{grid-column:1 / -1;margin-top:-6px}
  .rate{grid-template-columns:1fr}
  .seg button{flex:1}
  .rowg,.rowg.g2{grid-template-columns:1fr}
  .card{padding:16px}
}
@media (max-width:560px){
  .brand{flex:1 1 auto}
  .pick{order:3;width:100%} .pick select{flex:1;max-width:none;min-width:0}
  .tabs{order:4;width:100%} .tabs a{flex:1;text-align:center;padding:8px 6px}
  .tiles{grid-template-columns:1fr 1fr}
  .hero{padding:18px 16px 16px}
}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:.9rem;font-weight:500;cursor:pointer}
.chips button:hover{border-color:var(--court)}
section[id^="sec-"]{scroll-margin-top:130px}
.seg button:hover{border-color:var(--court)}
@media print{
  html:root:not([data-theme="x"]){--bg:#fff;--surface:#fff;--ink:#14261f;--muted:#5d6b64;--line:#d9dfd8;--court:#0f4c3a;--court-ink:#f1f6f2;--clay:#b9552e;--blue:#1f5c99;--good:#1d7a4f;--warn:#a36a00;--idle:#7b8781;--soft:#e9eee8;color-scheme:light}
  .bar,.no-print{display:none!important}
  body{font-size:12.5px}
  main{max-width:none;padding:0;gap:10px}
  .card,.hero,.plan article{break-inside:avoid}
  .card{padding:12px 14px}
  .hero,.meter i,.tile,.note,ul.clean li,.plan article{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .meter i.on{background:var(--court)!important}
}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <div class="brand"><i></i><span id="brand">Informe de Progreso</span></div>

    <select id="sel-period" aria-label="Período"></select>

</div></div>
<main id="app"></main>

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function avg(r,a){if(!r)return null;const v=a.items.map(it=>+r.ratings[a.id][it[0]]||0).filter(x=>x>0);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}

function delta(cur,prev,low){
  if(cur==null||prev==null)return '';
  const d=cur-prev;if(Math.abs(d)<0.05)return '<span class="delta same">= igual</span>';
  const good=low?d<0:d>0;
  return `<span class="delta ${good?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1).replace('.',',')}</span>`;
}
function radar(r,pr){
  const cx=180,cy=150,R=100,n=AREAS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
  const poly=rep=>AREAS.map((a,i)=>pt(i,avg(rep,a)||0).map(x=>x.toFixed(1)).join(',')).join(' ');
  let s=`<svg class="radar" viewBox="0 0 360 290" role="img" aria-label="Perfil del jugador por área, escala de 1 a 5">`;
  for(let k=1;k<=5;k++)s+=`<polygon points="${AREAS.map((a,i)=>pt(i,k).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  AREAS.forEach((a,i)=>{const e=pt(i,5),l=pt(i,6.1);const c=Math.cos(-Math.PI/2+i*2*Math.PI/n);
    s+=`<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="var(--line)"/>`;
    s+=`<text x="${l[0].toFixed(1)}" y="${(l[1]+4).toFixed(1)}" text-anchor="${Math.abs(c)<0.2?'middle':c>0?'start':'end'}" font-weight="600">${a.short}</text>`});
  if(pr&&!isEmpty(pr))s+=`<polygon points="${poly(pr)}" fill="none" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<polygon points="${poly(r)}" fill="var(--good)" fill-opacity=".22" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round"/>`;
  AREAS.forEach((a,i)=>{const v=avg(r,a);if(v!=null){const p=pt(i,v);s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--good)"/>`}});
  return s+'</svg>';
}

function inp(r,path,label,type,extra){const v=get(r,path);return `<label class="f" for="${fid(path)}">${label}<input type="${type||'text'}" id="${fid(path)}" data-path="${path}" value="${esc(v)}" ${extra||''}></label>`}
function area(r,path,label,ph){return `<label class="f" for="${fid(path)}">${label}<textarea id="${fid(path)}" data-path="${path}" placeholder="${esc(ph||'')}">${esc(get(r,path))}</textarea></label>`}
function completeness(r){
  let n=0,t=0;AREAS.forEach(a=>a.items.forEach(it=>{t++;if(+r.ratings[a.id][it[0]]>0)n++}));

}

    <div class="actions"><button class="btn" type="button" id="np-add">Agregar alumno</button><span class="hint" id="np-msg"></span></div></div></details></section>`;
  h+=`<section class="card" id="sec-9"><h2>Academia y respaldo</h2><div class="stack">
    <label class="f" for="cfg-academy">Nombre de la academia (aparece en el informe)<input type="text" id="cfg-academy" value="${esc(S.academy||'')}"></label>
    ${FRAMED?'<p class="hint">La impresión a PDF y el respaldo de datos funcionan en la versión web pública, fuera de esta vista previa.</p>':`<div class="actions"><button class="btn ghost" type="button" id="bk-out">Descargar respaldo de datos</button><label class="btn ghost" for="bk-in" style="cursor:pointer">Restaurar respaldo<input type="file" id="bk-in" accept="application/json,.json" hidden></label><span class="hint" id="bk-msg">Los datos viven solo en este navegador: descargue un respaldo con frecuencia.</span></div>`}
    <div class="actions"><button class="btn danger" type="button" id="reset">Borrar todo y volver a los datos de ejemplo</button><span class="hint" id="reset-msg"></span></div>
  </div></section>`;
  $('app').innerHTML=h;updProg();
  $('cfg-academy').addEventListener('input',e=>{S.academy=e.target.value.trim();save();$('brand').textContent=S.academy||'Informe de Progreso'});
  if($('bk-out')){
    $('bk-out').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='respaldo-informes-tenis.json';document.body.appendChild(a);a.click();a.remove()});
    $('bk-in').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
      fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.players)||!d.players.length)throw 0;S=d;if(!S.period)S.period=PERIODS[2][0];save();render()}catch(x){$('bk-msg').textContent='Ese archivo no es un respaldo válido de esta herramienta.'}};fr.readAsText(f)});
  }
  $('reset').addEventListener('click',e=>{const b=e.currentTarget;
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar: se borrarán todos los alumnos e informes';$('reset-msg').textContent='Toque de nuevo para confirmar.';
      setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='Borrar todo y volver a los datos de ejemplo';$('reset-msg').textContent=''}},5000);return}
    S=seed();save();render();window.scrollTo(0,0)});
  $('pull').addEventListener('click',()=>{const pr=prevReport();const src=pr?pr.plan.filter(g=>g.goal):[];
    if(!src.length){$('pull').textContent='No hay plan en el trimestre anterior';return}
    src.slice(0,3).forEach((g,i)=>{r.goals[i]={text:g.goal,status:r.goals[i].status||'pendiente'}});save();renderCoach()});
  $('np-add').addEventListener('click',()=>{const name=$('np-name').value.trim();
    if(!name){$('np-msg').textContent='Escriba el nombre del alumno.';return}
    const id='p'+Date.now();S.players.push({id,name,born:+$('np-born').value||'',level:$('np-level').value.trim(),group:$('np-group').value.trim(),coach:$('np-coach').value.trim(),reports:{}});
    S.player=id;S.demo=false;save();render()});
}

$('app').addEventListener('input',e=>{const el=e.target.closest('[data-path]');if(!el||view()!=='entrenador')return;
  let v=el.value;if(el.type==='number')v=v===''?'':+v;set(report(true),el.dataset.path,v);S.demo=false;save();updProg()});
$('app').addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){const t=$(go.dataset.go);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  const b=e.target.closest('.seg button');if(!b)return;
  const g=b.parentElement,path=g.dataset.rate,r=report(true),cur=+get(r,path)||0,v=+b.dataset.v;
  set(r,path,cur===v?0:v);g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===+get(r,path))));S.demo=false;save();updProg()});

function render(){
  $('sel-player').innerHTML=S.players.map(p=>`<option value="${p.id}" ${p.id===S.player?'selected':''}>${esc(p.name)}</option>`).join('');
  $('sel-period').innerHTML=PERIODS.map(p=>`<option value="${p[0]}" ${p[0]===S.period?'selected':''}>${p[1]}</option>`).join('');
  $('brand').textContent=S.academy||'Informe de Progreso';
  const v=view();
  $('tab-informe').toggleAttribute('aria-current',false);$('tab-entrenador').toggleAttribute('aria-current',false);
  $('tab-'+v).setAttribute('aria-current','page');
  if(v==='entrenador')renderCoach();else renderReport();
}
$('sel-player').addEventListener('change',e=>{S.player=e.target.value;save();render()});
$('sel-period').addEventListener('change',e=>{S.period=e.target.value;save();render()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
const THEMES=[['','◐','automático'],['light','☀','claro'],['dark','☾','oscuro']];
let th='';try{th=localStorage.getItem(KEY+'-theme')||''}catch(e){}
function applyTheme(){const t=THEMES.find(x=>x[0]===th)||THEMES[0];if(t[0])document.documentElement.setAttribute('data-theme',t[0]);else document.documentElement.removeAttribute('data-theme');
  $('theme').textContent=t[1];$('theme').title='Tema: '+t[2];$('theme').setAttribute('aria-label','Tema '+t[2]+'. Cambiar tema')}
$('theme').addEventListener('click',()=>{const i=THEMES.findIndex(x=>x[0]===th);th=THEMES[(i+1)%THEMES.length][0];try{localStorage.setItem(KEY+'-theme',th)}catch(e){}applyTheme()});
applyTheme();
render();
</script>
<script type="module" src="firebase.js"></script>
</body>
</html>
